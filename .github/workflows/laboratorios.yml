name: Laboratorios MongoDB 8.0
on:
  push:
    branches: [main, laboratorio/github-actions, docs/auditoria-manuales]
  pull_request:
    paths:
      - "lab/**"
      - "compose.yaml"
      - ".env.example"
      - "scripts/generar-certificados.sh"
      - "scripts/probar-seguridad.sh"
      - ".github/workflows/laboratorios.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indices:
    name: "Indices - ${{ matrix.ventas }} ventas"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ventas: [200000, 1000000]
    steps:
      - uses: actions/checkout@v5
      - name: Credencial efimera de laboratorio
        run: echo "MONGO_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Ejecutar MongoDB Community
        run: docker compose up -d --wait mongo-indices
      - name: Comprobar indices
        env:
          VENTAS: ${{ matrix.ventas }}
        run: docker compose exec -T -e VENTAS="$VENTAS" mongo-indices mongosh --quiet --file /lab/indices.js
      - name: Diagnostico
        if: failure()
        run: docker compose logs --tail=120 mongo-indices
      - name: Apagar
        if: always()
        run: docker compose down --volumes --remove-orphans
  seguridad:
    name: "Seguridad - SCRAM, TLS y X509"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Credenciales efimeras
        run: |
          echo "MONGO_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "LAB_READER_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "LAB_WRITER_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Preparar certificados
        run: bash scripts/generar-certificados.sh
      - name: Ejecutar contenedores
        run: docker compose up -d --wait mongo-seguridad mongo-tls
      - name: Comprobar seguridad
        run: bash scripts/probar-seguridad.sh
      - name: Diagnostico
        if: failure()
        run: docker compose logs --tail=120 mongo-seguridad mongo-tls
      - name: Apagar
        if: always()
        run: docker compose down --volumes --remove-orphans

  recorrido_aula:
    env:
      MONGO_ADMIN_PASSWORD: "clave-temporal-ci-no-persistente"
    name: "Recorrido de clase - datos sin indices"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Iniciar MongoDB
        env:
          MONGO_ADMIN_PASSWORD: laboratorio-desde-github-actions
        run: docker compose up -d --wait mongo-indices
      - name: Cargar 200000 ventas sin indices secundarios
        run: docker compose exec -T -e VENTAS=200000 mongo-indices mongosh --quiet --file /lab/sembrar_ventas.js
      - name: Probar progresion con explain e indices
        run: docker compose exec -T mongo-indices mongosh --quiet --file /lab/comprobar_recorrido_aula.js
      - name: Diagnostico
        if: failure()
        run: docker compose logs --tail=120 mongo-indices
      - name: Apagar
        if: always()
        run: docker compose down --volumes --remove-orphans

  manuales:
    env:
      MONGO_ADMIN_PASSWORD: "clave-temporal-ci-no-persistente"
    name: "Secuencia literal de scripts de indices del manual"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Arrancar MongoDB
        env:
          MONGO_ADMIN_PASSWORD: docente-efimero-sin-exposicion
        run: docker compose up -d --wait mongo-indices
      - name: Probar scripts docentes en orden
        run: |
          for script in 01_cargar_ventas 00_preflight 02_antes 03_crear_indices 04_despues 05_tipos 06_unique_ttl 07_ver_ttl 10_verificacion_indices 12_restaurar_indices; do
            echo "=== $script ==="
            docker compose exec -T -e VENTAS=200000 mongo-indices mongosh --quiet --file "/lab/$script.js"
          done
      - name: Diagnostico
        if: failure()
        run: docker compose logs --tail=120 mongo-indices
      - name: Apagar
        if: always()
        run: docker compose down --volumes --remove-orphans

  indices_compuestos_guiados:
    name: "Indices compuestos - laboratorio pedagogico ESR/ERS"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGO_ADMIN_PASSWORD: clave-efimera-docente-ci
    steps:
      - uses: actions/checkout@v5
      - name: Iniciar MongoDB Community
        run: docker compose up -d --wait mongo-indices
      - name: Cargar 200000 ventas e indices de la primera practica
        run: |
          docker compose exec -T -e VENTAS=200000 mongo-indices mongosh --quiet --file /lab/01_cargar_ventas.js
          docker compose exec -T mongo-indices mongosh --quiet --file /lab/03_crear_indices.js
      - name: Verificar indices compuestos ESR y ERS
        run: docker compose exec -T mongo-indices mongosh --quiet --file /lab/15_compuestos_guiado.js
      - name: Verificar indice unico parcial y cambios de estado
        run: docker compose exec -T mongo-indices mongosh --quiet --file /lab/17_partial_unique_guiado.js
      - name: Verificar ejercicios adicionales de los manuales
        run: docker compose exec -T mongo-indices mongosh --quiet --file /lab/18_validar_practicas_adicionales.js
      - name: Comprobar ejemplos complementarios de los manuales
        run: docker compose exec -T mongo-indices mongosh --quiet --file /lab/22_pruebas_de_practicas.js
      - name: Diagnosticar errores
        if: failure()
        run: docker compose logs --tail=120 mongo-indices
      - name: Apagar contenedores
        if: always()
        run: docker compose down --volumes --remove-orphans
